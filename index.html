<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Meu Site - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .dropdown:hover .dropdown-menu { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- NAVBAR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-400 hover:text-indigo-300 transition">
                <i class="fa-solid fa-code text-indigo-500 mr-2"></i>O Meu Site
            </a>

            <nav class="flex items-center space-x-6">
                <a href="index.html" class="text-indigo-400 font-medium transition text-lg">Home</a>

                <!-- DROPDOWN DE PÁGINAS -->
                <div class="relative dropdown">
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg flex items-center space-x-2 transition shadow-md">
                        <span>Páginas</span>
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </button>

                    <div class="dropdown-menu hidden absolute right-0 mt-1 w-48 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">
                        <a href="paginas/pagina1.html" class="block px-4 py-3 hover:bg-slate-700 hover:text-indigo-400 transition border-b border-slate-700/50">
                            <i class="fa-solid fa-rocket mr-2 text-indigo-400"></i> Página 1
                        </a>
                        <a href="paginas/pagina2.html" class="block px-4 py-3 hover:bg-slate-700 hover:text-indigo-400 transition border-b border-slate-700/50">
                            <i class="fa-solid fa-star mr-2 text-indigo-400"></i> Página 2
                        </a>
                        <a href="paginas/pagina3.html" class="block px-4 py-3 hover:bg-slate-700 hover:text-indigo-400 transition">
                            <i class="fa-solid fa-layer-group mr-2 text-indigo-400"></i> Página 3
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-4xl mx-auto px-6 py-16 flex items-center justify-center text-center">
        <div class="space-y-6">
            <span class="bg-indigo-500/10 text-indigo-400 text-sm font-semibold px-4 py-1.5 rounded-full border border-indigo-500/20">
                Página Inicial
            </span>
            <h1 class="text-6xl font-extrabold tracking-tight text-white">Olá! 👋</h1>
            <p class="text-xl text-slate-400 max-w-2xl mx-auto">
                Bem-vindo ao site! Usa a barra de navegação no topo para abrir o dropdown e aceder às restantes páginas.
            </p>
            <div class="pt-4">
                <a href="paginas/pagina1.html" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-lg transition shadow-lg">
                    Ir para a Página 1
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-800/50 border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p> 2026 O Meu Site - GitHub Pages</p>
    </footer>

</body>
</html>
